<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
  </head>
  <body>
    <!-- Mini replica of the SolaX portal: exactly the selectors the default
         extractor relies on, so the selftest exercises the real flow without
         touching the internet. -->
    <div id="login">
      <input placeholder="Please enter your user name/email/mobile number" />
      <input placeholder="Enter Password" type="password" />
      <div id="agreeMent"><span class="arco-checkbox-icon-hover">agree</span></div>
      <button class="submit-button" type="button">Login</button>
    </div>
    <div id="portal" hidden>
      <div class="logo-api">API</div>
      <div id="apiPanel" hidden>
        <span class="title">tokenID:</span><span class="value">FIXTURE1234567890TOKEN</span>
      </div>
    </div>
    <script>
      const EMAIL = "fixture@example.com";
      const PASSWORD = "fixture-pass";
      let agreed = false;
      document
        .querySelector("#agreeMent .arco-checkbox-icon-hover")
        .addEventListener("click", () => {
          agreed = true;
        });
      document.querySelector(".submit-button").addEventListener("click", () => {
        const [userInput, passwordInput] = document.querySelectorAll("input");
        if (!agreed || userInput.value !== EMAIL || passwordInput.value !== PASSWORD) return;
        document.querySelector("#login").hidden = true;
        document.querySelector("#portal").hidden = false;
        document.title = "Solax Cloud System";
      });
      document.querySelector(".logo-api").addEventListener("click", () => {
        document.querySelector("#apiPanel").hidden = false;
      });
    </script>
  </body>
</html>
